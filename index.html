<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="本地 H5 工具集：文档导出、时间码转换等" />
  <title>工具集</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="common.css" />
  <style>
    .hero {
      padding: 56px 24px 34px;
      text-align: center;
      background:
        radial-gradient(760px 280px at 50% 0, rgba(79, 108, 247, .16), transparent 70%),
        var(--bg);
    }

    .eyebrow {
      margin: 0;
      color: var(--brand);
      font: 500 11px/1.2 var(--mono);
      letter-spacing: .2em;
    }

    .hero h1 {
      margin: 12px 0 0;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .hero p.lead {
      margin: 12px auto 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .search {
      width: min(420px, 100%);
      height: 46px;
      margin: 26px auto 0;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: block;
      color: var(--text);
      background: var(--surface);
      font: inherit;
      font-size: 14px;
      outline: none;
      box-shadow: 0 1px 2px rgba(23, 32, 51, .04);
      transition: border-color .15s, box-shadow .15s;
    }

    .search:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(79, 108, 247, .15);
    }

    main {
      width: min(1040px, calc(100% - 40px));
      margin: 0 auto;
      padding-bottom: 20px;
    }

    .section-title {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .grid {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      height: 100%;
      min-height: 168px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      color: inherit;
      background: var(--surface);
      text-decoration: none;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }

    .card:hover {
      border-color: #b9c6ee;
      box-shadow: 0 12px 28px rgba(23, 32, 51, .08);
      transform: translateY(-2px);
    }

    .card:focus-visible {
      outline: 3px solid rgba(79, 108, 247, .45);
      outline-offset: 2px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--c, var(--brand));
      background: color-mix(in srgb, var(--c, var(--brand)) 12%, white);
      font: 700 15px/1 var(--mono);
    }

    .tag {
      padding: 3px 10px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--bg);
      font-size: 12px;
    }

    .card h2 {
      margin: 18px 0 6px;
      font-size: 18px;
      font-weight: 650;
    }

    .card p {
      margin: 0;
      flex: 1;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.65;
    }

    .go {
      margin-top: 16px;
      color: var(--brand);
      font-size: 13px;
      font-weight: 650;
    }

    .card:hover .go {
      color: var(--brand-dark);
    }

    .empty {
      padding: 36px 16px;
      border: 1px dashed #cdd5e2;
      border-radius: 14px;
      color: var(--muted);
      background: var(--surface);
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 560px) {
      .hero {
        padding-top: 36px;
      }

      .hero h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <a class="brand" href="index.html"><span class="brand-mark">T</span>工具集</a>
  </header>

  <section class="hero">
    <p class="eyebrow">LOCAL TOOLKIT</p>
    <h1>把日常小事，交给浏览器</h1>
    <p class="lead">文档导出、时间码换算等工具集中在一处。所有内容只在本机浏览器里处理，不上传。</p>
    <input id="search" class="search" type="search" placeholder="搜索功能名称或说明" autocomplete="off" aria-label="搜索功能" />
  </section>

  <main>
    <h2 class="section-title" id="count">全部功能</h2>
    <ul id="featureList" class="grid"></ul>
    <p id="empty" class="empty" hidden>没有匹配的功能。</p>
  </main>

  <footer class="app-footer">内容仅在当前浏览器中处理</footer>

  <script>
    // 后续新增功能：在这里追加一项即可，页面会自动生成卡片并支持搜索。
    // icon: 卡片图标上的 1-2 个字符；color: 图标主色；tag: 分类标签。
    const FEATURES = [
      {
        name: "Markdown 文档导出",
        desc: "在浏览器里把 Markdown 转成 Word 或 PDF，右侧实时显示 A4 版式预览，支持表格、代码块、本地图片和分页符。",
        href: "markdown-export.html",
        icon: "MD",
        color: "#4f6cf7",
        tag: "文档"
      },
      {
        name: "P90计算",
        desc: "把 时:分:秒:帧 换成 时:分:秒.百分秒，记录多次测试的开始与结束，自动算出 P90 耗时并导出 Excel。",
        href: "timecode-converter.html",
        icon: "TC",
        color: "#0f9d8a",
        tag: "测试"
      },
      {
        name: "JSON 格式化",
        desc: "格式化、压缩、校验和转义，定位语法错误，修复注释和单引号等写法，支持树形查看与路径查询。",
        href: "json-formatter.html",
        icon: "{ }",
        color: "#d97706",
        tag: "开发"
      },
      {
        name: "时间戳转换",
        desc: "时间戳与日期互转，自动识别秒、毫秒、微秒、纳秒，支持时区、批量转换、时间差和时间推算。",
        href: "timestamp.html",
        icon: "TS",
        color: "#7c3aed",
        tag: "开发"
      }
    ];

    const list = document.querySelector("#featureList");
    const empty = document.querySelector("#empty");
    const count = document.querySelector("#count");
    const search = document.querySelector("#search");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render(keyword = "") {
      const key = keyword.trim().toLowerCase();
      const shown = FEATURES.filter((f) =>
        !key || `${f.name} ${f.desc} ${f.tag || ""}`.toLowerCase().includes(key));

      list.replaceChildren(...shown.map((feature) => {
        const item = el("li");
        const link = el("a", "card");
        link.href = feature.href;
        link.style.setProperty("--c", feature.color || "#4f6cf7");

        const top = el("div", "card-top");
        top.append(el("span", "icon", feature.icon || feature.name.slice(0, 2)));
        if (feature.tag) top.append(el("span", "tag", feature.tag));

        link.append(top, el("h2", "", feature.name), el("p", "", feature.desc), el("span", "go", "进入 →"));
        item.append(link);
        return item;
      }));

      empty.hidden = shown.length > 0;
      count.textContent = key ? `找到 ${shown.length} 个功能` : `全部功能（${FEATURES.length}）`;
    }

    search.addEventListener("input", () => render(search.value));
    render();
  </script>
</body>

</html>
